name: CI

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run full pipeline
        run: PYTHON=python scripts/run_pipeline.sh

      - name: Check reproducible text outputs
        # PNG bytes vary with host font availability, so CI deliberately checks
        # only the deterministic research tables and supporting text outputs.
        run: git diff --exit-code -- '*.csv' '*.md' '*.txt' '*.json'
