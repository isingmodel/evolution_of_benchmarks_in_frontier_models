name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run full pipeline
        run: PYTHON=python scripts/run_pipeline.sh

      - name: Check reproducible text outputs
        # PNG bytes vary with host font availability, so CI deliberately checks
        # only the deterministic research tables and supporting text outputs.
        run: |
          git diff --exit-code -- '*.csv' '*.md' '*.txt' '*.json'
          untracked="$(
            git ls-files --others --exclude-standard |
              grep -E '\.(csv|md|txt|json)$' || true
          )"
          if [[ -n "${untracked}" ]]; then
            echo "Pipeline generated untracked text outputs:"
            echo "${untracked}"
            exit 1
          fi
